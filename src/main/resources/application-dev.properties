# ==================================================
# DEV PROFILE — H2 In-Memory Database
# Overrides Oracle settings in application.properties
# Use this to run WITHOUT Oracle installed
# ==================================================

# H2 in-memory datasource (no installation needed)
spring.datasource.url=jdbc:h2:mem:carexpensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console — open at http://localhost:8080/h2-console to view data
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — auto-create tables from entity (H2 compatible)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Oracle schema.sql (H2 will use ddl-auto instead)
spring.sql.init.mode=never

# Disable Vaadin development mode toolbar / notification
vaadin.devTools.enabled=false
