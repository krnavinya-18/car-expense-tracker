# ==================================================
# DATABASE CONFIGURATION - Oracle Database
# ==================================================
# Set these values via environment variables or edit directly (do NOT commit credentials)
# Environment variable override example:
#   DB_URL=jdbc:oracle:thin:@localhost:1521:XE
#   DB_USERNAME=your_username
#   DB_PASSWORD=your_password

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XE}
spring.datasource.username=${DB_USERNAME:your_oracle_username}
spring.datasource.password=${DB_PASSWORD:your_oracle_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==================================================
# JPA / HIBERNATE CONFIGURATION
# ==================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# SQL INITIALIZATION
# ==================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# ==================================================
# SERVER CONFIGURATION
# ==================================================
server.port=8080

# ==================================================
# VAADIN CONFIGURATION
# ==================================================
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,dev.hilla,com.carexpense
vaadin.devTools.enabled=false

# ==================================================
# APPLICATION CONFIGURATION
# ==================================================
spring.application.name=Car Expense Tracking System
